<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ha-fleet — Fleet Manager</title>
  <style>
    :root {
      /* Greyscale surfaces, darkest -> lightest */
      --bg:      #0e0e10;   /* app background           */
      --panel:   #16171a;   /* sidebar / header / cards */
      --panel2:  #1d1e22;   /* raised controls / hover  */
      --panel3:  #26272c;   /* table header / active bg */
      --border:  #2c2d32;   /* hairlines                */
      --border2: #3a3b41;   /* stronger hairline        */
      --fg:      #e8e9ec;   /* primary text             */
      --fg2:     #b4b6bc;   /* secondary text           */
      --muted:   #7c7e86;   /* tertiary / labels        */
      /* Home Assistant blue — the ONLY accent */
      --ha:      #03a9f4;
      --ha-dim:  #03a9f433;
      --ha-fg:   #4fc3f7;
      /* Desaturated status (used sparingly, dot/pill only) */
      --ok:      #6cbf84;
      --warn:    #d6a44c;
      --err:     #d47070;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
    app-shell { display: block; height: 100vh; }
  </style>
</head>
<body>
  <app-shell></app-shell>

  <script type="module">
    import { LitElement, html, css, svg, repeat, nothing } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/all/lit-all.min.js';

    const API = (location.search.match(/[?&]api=([^&]+)/) || [, 'http://127.0.0.1:8080'])[1];

    /* ---- icons: inline SVG, currentColor, 1.6 stroke, no emoji ------------- */
    const icon = {
      logo: (s = 22) => svg`<svg viewBox="0 0 24 24" width=${s} height=${s} fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M10 20v-5h4v5"/></svg>`,
      refresh: svg`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`,
      restart: svg`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`,
      warn: svg`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 9v5"/><path d="M12 17h.01"/></svg>`,
      check: svg`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
      close: svg`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
      code: svg`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>`,
      logout: svg`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>`,
    };

    /* ---- auth -------------------------------------------------------------- */
    const Auth = {
      me: { authenticated: false },
      _subs: new Set(),
      onChange(f) { this._subs.add(f); return () => this._subs.delete(f); },
      async refresh() {
        try { const r = await fetch(`${API}/auth/me`, { credentials: 'include' }); this.me = await r.json(); }
        catch { this.me = { authenticated: false }; }
        this._subs.forEach(f => f());
      },
      role() { return this.me.role || null; },
      can(min) { const o = { viewer: 0, operator: 1, admin: 2 }; return this.me.authenticated && o[this.me.role] >= o[min]; },
      async logout() { await fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'include' }); await this.refresh(); },
    };

    async function api(path, { method = 'GET', body } = {}) {
      const headers = body ? { 'content-type': 'application/json' } : {};
      const r = await fetch(`${API}${path}`, { method, headers, credentials: 'include', body: body ? JSON.stringify(body) : undefined });
      const text = await r.text();
      let json; try { json = text ? JSON.parse(text) : {}; } catch { json = { raw: text }; }
      return { ok: r.ok, status: r.status, json };
    }

    const fmtTs = (v) => {
      if (!v) return '—';
      const d = new Date(v); if (isNaN(d)) return String(v);
      return d.toLocaleString(undefined, { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    };

    /* ---- shared control / table / card system ----------------------------- */
    const ui = css`
      button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
               background: var(--panel2); color: var(--fg); border: 1px solid var(--border2);
               border-radius: 7px; cursor: pointer; font: inherit; font-size: 13px; line-height: 1;
               white-space: nowrap; transition: border-color .12s, background .12s; }
      button:hover:not(:disabled) { border-color: var(--ha); color: #fff; }
      button:disabled { opacity: .38; cursor: not-allowed; }
      button svg { flex: none; }
      button.primary { background: var(--ha-dim); border-color: var(--ha); color: var(--ha-fg); }
      button.primary:hover:not(:disabled) { background: #03a9f455; color: #fff; }
      button.danger { border-color: #5a3030; color: var(--err); background: #1e1718; }
      button.danger:hover:not(:disabled) { background: #2a1a1b; border-color: var(--err); color: #fff; }
      button.ghost { background: none; border-color: transparent; color: var(--muted); height: 28px; padding: 0 8px; }
      button.ghost:hover:not(:disabled) { background: var(--panel2); color: var(--fg); border-color: transparent; }
      input, select { height: 32px; background: var(--bg); color: var(--fg); border: 1px solid var(--border2);
               border-radius: 7px; padding: 0 10px; font: inherit; font-size: 13px; }
      input:focus, select:focus { outline: none; border-color: var(--ha); }
      input::placeholder { color: var(--muted); }
      label { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
              display: block; margin: 16px 0 6px; font-weight: 600; }
      .muted { color: var(--muted); font-size: 12px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

      /* pills */
      .pill { font-size: 10px; letter-spacing: .03em; text-transform: uppercase; font-weight: 600;
              padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border2); color: var(--fg2); background: var(--panel2); }
      .pill.ha { color: var(--ha-fg); border-color: var(--ha); background: var(--ha-dim); }
      .pill.ok { color: var(--ok); border-color: #3c5a46; background: #16211a; }
      .pill.warn { color: var(--warn); border-color: #5a4e30; background: #211d14; }
      .pill.err { color: var(--err); border-color: #5a3030; background: #211617; }
      .pill.role { cursor: default; }

      /* status dot */
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

      /* section card */
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin: 0 0 16px; }
      .card > .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
      .card-h h3 { margin: 0; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--fg2); font-weight: 600; }

      /* tables */
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      thead th { text-align: left; padding: 8px 12px; background: var(--panel3); color: var(--muted);
                 font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
                 border-bottom: 1px solid var(--border); position: sticky; top: 0; }
      thead th:first-child { border-top-left-radius: 8px; }
      thead th:last-child { border-top-right-radius: 8px; }
      tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr.clickable { cursor: pointer; }
      tbody tr.clickable:hover td { background: var(--panel2); }
      .t-wrap { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--panel); }
      .t-scroll { max-height: 440px; overflow: auto; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--fg2); }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .empty-row td { color: var(--muted); text-align: center; padding: 24px; }

      /* raw JSON block (secondary) */
      pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
            overflow: auto; font-size: 12px; color: var(--fg2); margin: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    `;

    /* ======================================================================
       <app-shell>
       ====================================================================== */
    class AppShell extends LitElement {
      static properties = { instances: { state: true }, selected: { state: true }, error: { state: true }, _me: { state: true } };
      static styles = [ui, css`
        :host { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
        header { display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 56px;
                 border-bottom: 1px solid var(--border); background: var(--panel); }
        .brand { display: flex; align-items: center; gap: 9px; }
        .brand .mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
                       background: var(--ha-dim); color: var(--ha-fg); border: 1px solid var(--ha); }
        .brand .name { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
        .brand .name b { color: var(--ha-fg); font-weight: 650; }
        .brand .tag { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-left: 2px; }
        .spacer { flex: 1; }
        .who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg2); }
        .who .email { color: var(--fg); }

        .body { display: grid; grid-template-columns: 310px 1fr; min-height: 0; }
        aside { border-right: 1px solid var(--border); overflow: auto; background: var(--panel); }
        .sb-head { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
                   position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 1; }
        .sb-head .counts { font-size: 12px; color: var(--muted); }
        .sb-head .counts b { color: var(--fg); font-weight: 600; }
        main { overflow: auto; padding: 22px 26px; }
        .empty { color: var(--muted); padding: 48px 24px; text-align: center; }

        /* login */
        .login { height: 100vh; display: grid; place-items: center; }
        .login .card { width: 400px; max-width: 90vw; text-align: center; padding: 36px 40px 30px; }
        .login .mark { width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 16px; display: grid; place-items: center;
                       background: var(--ha-dim); color: var(--ha-fg); border: 1px solid var(--ha); }
        .login h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
        .login h1 b { color: var(--ha-fg); }
        .login p { color: var(--muted); margin: 0 0 22px; font-size: 13px; }
        .login .full { width: 100%; height: 38px; justify-content: center; font-size: 14px; }
        .login .hint { font-size: 12px; color: var(--muted); margin-top: 20px; line-height: 1.9;
                       border-top: 1px solid var(--border); padding-top: 16px; }
        .login .hint code { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--fg2); }
      `];
      constructor() {
        super(); this.instances = []; this.selected = null; this.error = ''; this._me = Auth.me;
        this._off = Auth.onChange(() => {
          const was = this._me.authenticated;
          this._me = Auth.me; this.requestUpdate();
          if (Auth.me.authenticated && !was) this._poll();
        });
        Auth.refresh();
      }
      disconnectedCallback() { super.disconnectedCallback(); clearTimeout(this._t); this._off?.(); }
      async _poll() {
        if (!Auth.me.authenticated) return;
        const { ok, status, json } = await api('/instances');
        if (ok) {
          const next = json.instances || [];
          const sig = JSON.stringify(next);
          if (sig !== this._sig) { this._sig = sig; this.instances = next; }   // reference-stable: no needless re-render
          this.error = '';
        } else if (status === 401) { this.instances = []; this._sig = ''; await Auth.refresh(); }
        else this.error = `Cannot reach the operator API at ${API}.`;
        this._t = setTimeout(() => this._poll(), 5000);
      }
      _login() { window.location.href = `${API}/auth/start`; }

      _loginScreen() {
        return html`<div class="login"><div class="card">
          <div class="mark">${icon.logo(26)}</div>
          <h1>ha<b>·</b>fleet</h1>
          <p>Sign in to manage your Home Assistant fleet.</p>
          <button class="primary full" @click=${() => this._login()}>Sign in with OIDC</button>
          <div class="hint">
            Dev logins &middot; password <code>password</code><br>
            <code>admin@ha-fleet.dev</code> &nbsp; <code>operator@ha-fleet.dev</code> &nbsp; <code>viewer@ha-fleet.dev</code>
          </div>
        </div></div>`;
      }
      render() {
        const me = this._me;
        if (!me.authenticated) return this._loginScreen();
        const sel = this.instances.find(i => i.instance_id === this.selected);
        const online = this.instances.filter(i => i.online).length;
        return html`
          <header>
            <div class="brand">
              <span class="mark">${icon.logo(18)}</span>
              <span class="name">ha<b>·</b>fleet</span>
              <span class="tag">Fleet Manager</span>
            </div>
            <span class="spacer"></span>
            <div class="who">
              <span class="email">${me.email || me.sub}</span>
              <span class="pill role ${me.role === 'admin' ? 'err' : me.role === 'operator' ? 'ha' : ''}">${me.role}</span>
              <button class="ghost" @click=${() => Auth.logout()}>${icon.logout} Sign out</button>
            </div>
          </header>
          <div class="body">
            <aside>
              <div class="sb-head">
                <span class="counts"><b>${this.instances.length}</b> instances &middot; <b>${online}</b> online</span>
                <button class="ghost" @click=${() => this._poll()} title="Refresh">${icon.refresh}</button>
              </div>
              ${repeat(this.instances, i => i.instance_id, i => html`
                <fleet-row .instance=${i} ?active=${i.instance_id === this.selected}
                  @pick=${() => (this.selected = i.instance_id)}></fleet-row>`)}
              ${this.instances.length === 0 ? html`<div class="empty">No instances enrolled.</div>` : ''}
            </aside>
            <main>
              ${this.error ? html`<div class="card" style="border-color:#5a3030;color:var(--err)">${this.error}</div>` : ''}
              ${sel
                ? html`<instance-pane .instance=${sel} .me=${me}></instance-pane>`
                : html`<div class="empty" style="margin-bottom:18px">Select an instance from the sidebar to inspect and manage it.</div>
                       <templates-panel .me=${me}></templates-panel>`}
            </main>
          </div>`;
      }
    }
    customElements.define('app-shell', AppShell);

    /* ======================================================================
       <fleet-row>
       ====================================================================== */
    class FleetRow extends LitElement {
      static properties = { instance: { attribute: false }, active: { type: Boolean, reflect: true } };
      static styles = [ui, css`
        :host { display: block; }
        .row { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
               border-left: 2px solid transparent; transition: background .1s; }
        .row:hover { background: var(--panel2); }
        :host([active]) .row { background: var(--panel3); border-left-color: var(--ha); }
        .top { display: flex; align-items: center; gap: 8px; }
        .name { font-weight: 600; font-size: 13.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
      `];
      render() {
        const i = this.instance;
        return html`
          <div class="row" @click=${() => this.dispatchEvent(new CustomEvent('pick'))}>
            <div class="top">
              <span class="dot" style="background:${i.online ? 'var(--ok)' : 'var(--err)'}"></span>
              <span class="name">${i.display_name}</span>
            </div>
            <div class="meta">${i.install_type} &middot; HA ${i.ha_version ?? '—'} &middot; ${(i.capabilities || []).length} caps</div>
          </div>`;
      }
    }
    customElements.define('fleet-row', FleetRow);

    /* ======================================================================
       <json-drawer>: right-side lightbox for raw JSON / row detail
       ====================================================================== */
    class JsonDrawer extends LitElement {
      static properties = { open: { type: Boolean, reflect: true }, title: {}, data: { attribute: false } };
      static styles = [ui, css`
        .scrim { position: fixed; inset: 0; background: #000a; opacity: 0; pointer-events: none;
                 transition: opacity .18s; z-index: 40; }
        :host([open]) .scrim { opacity: 1; pointer-events: auto; }
        .panel { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 94vw);
                 background: var(--panel); border-left: 1px solid var(--border2); z-index: 41;
                 transform: translateX(100%); transition: transform .18s ease; display: flex; flex-direction: column; }
        :host([open]) .panel { transform: translateX(0); }
        .d-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                  padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .d-head h3 { margin: 0; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg2); }
        .d-body { padding: 16px; overflow: auto; flex: 1; }
      `];
      render() {
        return html`
          <div class="scrim" @click=${() => this._close()}></div>
          <div class="panel" role="dialog" aria-label=${this.title || 'Details'}>
            <div class="d-head">
              <h3>${this.title || 'Raw JSON'}</h3>
              <button class="ghost" @click=${() => this._close()}>${icon.close}</button>
            </div>
            <div class="d-body"><pre>${JSON.stringify(this.data ?? {}, null, 2)}</pre></div>
          </div>`;
      }
      _close() { this.open = false; this.dispatchEvent(new CustomEvent('close')); }
    }
    customElements.define('json-drawer', JsonDrawer);

    /* ======================================================================
       <data-table>: the one table component (columns + rows + empty + raw)
       cols: [{ key, label, align?, render?(row), mono? }]
       ====================================================================== */
    class DataTable extends LitElement {
      static properties = { cols: { attribute: false }, rows: { attribute: false },
                            empty: {}, loading: { type: Boolean }, onrow: { attribute: false } };
      static styles = [ui];
      render() {
        const cols = this.cols || [];
        return html`<div class="t-wrap"><div class="t-scroll"><table>
          <thead><tr>${cols.map(c => html`<th class=${c.align === 'right' ? 'num' : ''}>${c.label}</th>`)}</tr></thead>
          <tbody>
            ${this.loading ? html`<tr class="empty-row"><td colspan=${cols.length}>Loading…</td></tr>`
              : (!this.rows || this.rows.length === 0)
                ? html`<tr class="empty-row"><td colspan=${cols.length}>${this.empty || 'Nothing to show.'}</td></tr>`
                : this.rows.map(r => html`<tr class=${this.onrow ? 'clickable' : ''}
                    @click=${this.onrow ? () => this.onrow(r) : null}>
                    ${cols.map(c => html`<td class="${c.align === 'right' ? 'num' : ''} ${c.mono ? 'mono' : ''}">
                      ${c.render ? c.render(r) : (r[c.key] ?? '—')}</td>`)}
                  </tr>`)}
          </tbody>
        </table></div></div>`;
      }
    }
    customElements.define('data-table', DataTable);

    /* ======================================================================
       <result-box>: action result, as a status line + raw drawer toggle
       ====================================================================== */
    class ResultBox extends LitElement {
      static properties = { result: { attribute: false }, _open: { state: true } };
      static styles = [ui, css`
        :host { display: block; margin-top: 14px; }
        .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
               border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 13px; }
        .bar.ok { border-color: #3c5a46; } .bar.err { border-color: #5a3030; }
        .label { font-weight: 600; }
        .code { color: var(--muted); font-size: 12px; }
      `];
      render() {
        if (!this.result) return nothing;
        const { ok, status, json, label } = this.result;
        return html`
          <div class="bar ${ok ? 'ok' : 'err'}">
            <span class="dot" style="background:${ok ? 'var(--ok)' : 'var(--err)'}"></span>
            <span class="label">${label}</span>
            <span class="code">HTTP ${status}</span>
            <span style="flex:1"></span>
            <button class="ghost" @click=${() => (this._open = true)}>${icon.code} Raw</button>
          </div>
          <json-drawer ?open=${this._open} title=${`${label} — response`} .data=${json}
            @close=${() => (this._open = false)}></json-drawer>`;
      }
    }
    customElements.define('result-box', ResultBox);

    /* ======================================================================
       <instance-pane>
       ====================================================================== */
    class InstancePane extends LitElement {
      static properties = { instance: { attribute: false }, me: { attribute: false },
        tab: { state: true }, data: { state: true }, result: { state: true },
        busy: { state: true }, _drawer: { state: true } };
      static styles = [ui, css`
        .hd { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 4px; }
        .hd h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
        .hd .dot { margin-top: 7px; width: 10px; height: 10px; }
        .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
        .sub .mono { color: var(--fg2); }
        .caps { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px; }
        .cap { font-size: 10.5px; background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
               padding: 2px 7px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }

        .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
        .tabs button { height: 36px; border: none; border-bottom: 2px solid transparent; border-radius: 0;
                       background: none; padding: 0 13px; color: var(--muted); font-size: 13px; }
        .tabs button:hover { color: var(--fg); border-color: transparent; background: none; }
        .tabs button.active { color: var(--ha-fg); border-bottom-color: var(--ha); }
        .tabs .badge { margin-left: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
                       background: var(--ha-dim); color: var(--ha-fg); font-size: 10px; font-weight: 700;
                       display: inline-flex; align-items: center; justify-content: center; }
        .tabs .badge.warn { background: #211d14; color: var(--warn); }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 900px){ .grid2 { grid-template-columns: 1fr; } }
        .gate { display: flex; align-items: center; gap: 8px; color: var(--warn); font-size: 12.5px;
                background: #211d1480; border: 1px solid #5a4e3080; border-radius: 8px; padding: 9px 12px; margin-bottom: 16px; }
        .verlead { color: var(--muted); } .verlead b { color: var(--ha-fg); }
      `];
      constructor() { super(); this.tab = 'inspect'; this.data = {}; this.result = null; this.busy = false; this._drawer = null; }
      updated(ch) {
        if (ch.has('instance') && this.instance?.instance_id !== this._lastId) {
          this._lastId = this.instance?.instance_id;
          this.result = null; this.data = {}; this._loadTab(this.tab);  // only on real identity change
        }
      }
      can(min) { const o = { viewer: 0, operator: 1, admin: 2 }; return this.me?.authenticated && o[this.me.role] >= o[min]; }
      id() { return this.instance.instance_id; }
      q(sel) { return this.renderRoot.querySelector(sel); }
      async _run(label, path, opts) { this.busy = true; this.result = { ...(await api(path, opts)), label }; this.busy = false; this._loadTab(this.tab); }
      async _load() {
        const id = this.id();
        const [s, l, a] = await Promise.all([
          api(`/instances/${id}/states`), api(`/instances/${id}/logs`), api(`/instances/${id}/audit?limit=50`)]);
        this.data = { ...this.data, states: s.json, logs: l.json, audit: a.json };
      }
      async _loadTab(t) {
        const id = this.id();
        if (t === 'inspect' || t === 'audit') return this._load();
        const path = { notifications: 'notifications', services: 'services', devices: 'devices', updates: 'updates/pending' }[t];
        if (!path) return;
        const { json } = await api(`/instances/${id}/${path}`);
        // endpoints wrap payloads as {ok, result:{...}}; store the inner result
        // so bindings read result.notifications / result.integrations / etc. flatly.
        this.data = { ...this.data, [t]: json?.result ?? json };
      }

      _counts() {
        const n = (this.data.notifications?.notifications || []).length;
        const u = (this.data.updates?.updates || []).length;
        return { n, u };
      }
      render() {
        const i = this.instance;
        const { n, u } = this._counts();
        const tabs = [
          ['inspect', 'Inspect'], ['notifications', 'Notifications', n, 'warn'],
          ['services', 'Services'], ['devices', 'Devices'], ['updates', 'Updates', u, 'ha'],
          ['manage', 'Manage'], ['backups', 'Backups'], ['users', 'Users'],
          ['proxy', 'Proxy'], ['selfupdate', 'Agent'], ['audit', 'Audit'],
        ];
        return html`
          <div class="hd">
            <span class="dot" style="background:${i.online ? 'var(--ok)' : 'var(--err)'}"></span>
            <h2>${i.display_name}</h2>
          </div>
          <div class="sub"><span class="mono">${i.instance_id}</span> &middot; ${i.install_type}
            &middot; HA ${i.ha_version ?? '—'} &middot; ${i.online ? 'online' : 'offline'}</div>
          <div class="caps">${(i.capabilities || []).map(c => html`<span class="cap">${c}</span>`)}</div>

          <div class="tabs">
            ${tabs.map(([t, label, badge, kind]) => html`<button class=${this.tab === t ? 'active' : ''}
              @click=${() => { this.tab = t; this.result = null; this._loadTab(t); }}>
              ${label}${badge ? html`<span class="badge ${kind === 'warn' ? 'warn' : ''}">${badge}</span>` : nothing}</button>`)}
          </div>

          ${this._tab()}
          <result-box .result=${this.result}></result-box>
          <json-drawer ?open=${!!this._drawer} title=${this._drawer?.title || ''} .data=${this._drawer?.data}
            @close=${() => (this._drawer = null)}></json-drawer>`;
      }

      _rawBtn(title, data) {
        return html`<button class="ghost" @click=${() => (this._drawer = { title, data })}>${icon.code} Raw JSON</button>`;
      }

      _tab() {
        switch (this.tab) {
          case 'inspect': return this._inspect();
          case 'notifications': return this._notifications();
          case 'services': return this._services();
          case 'devices': return this._devices();
          case 'updates': return this._updates();
          case 'audit': return this._audit();
          case 'manage': return this._manage();
          case 'backups': return this._backups();
          case 'users': return this._users();
          case 'proxy': return this._proxy();
          case 'selfupdate': return this._selfupdate();
        }
      }

      /* ---- read views: tables, with raw JSON as a secondary drawer -------- */
      _inspect() {
        const states = this.data.states?.result || this.data.states?.states || [];
        const stateRows = Array.isArray(states) ? states
          : Object.entries(states).map(([entity_id, v]) => ({ entity_id, state: v?.state ?? v, attributes: v?.attributes }));
        const logs = this.data.logs?.result || this.data.logs?.logs || (Array.isArray(this.data.logs) ? this.data.logs : []);
        return html`
          <div class="grid2">
            <div class="card">
              <div class="card-h"><h3>States (${stateRows.length})</h3>${this._rawBtn('States — raw', this.data.states)}</div>
              <data-table .cols=${[
                { key: 'entity_id', label: 'Entity', mono: true, render: r => html`<span class="mono">${r.entity_id}</span>${r.attributes?.friendly_name ? html`<div class="muted">${r.attributes.friendly_name}</div>` : nothing}` },
                { key: 'state', label: 'State', render: r => html`<span class="pill ${/^(on|home|open|active|above_horizon)$/i.test(r.state) ? 'ok' : ''}">${r.state ?? '—'}</span>` },
                { key: 'last_changed', label: 'Changed', render: r => html`<span class="muted">${fmtTs(r.last_changed)}</span>` },
              ]} .rows=${stateRows} .loading=${!this.data.states}
                .onrow=${r => (this._drawer = { title: r.entity_id, data: r })} empty="No entity states."></data-table>
            </div>
            <div class="card">
              <div class="card-h"><h3>Logs (${(logs || []).length})</h3>${this._rawBtn('Logs — raw', this.data.logs)}</div>
              <data-table .cols=${[
                { key: 'level', label: 'Level', render: r => this._lvl(r.level || r.severity) },
                { key: 'message', label: 'Message', render: r => html`<span class="mono">${r.message || r.msg || JSON.stringify(r)}</span>` },
                { key: 'when', label: 'Time', render: r => html`<span class="muted">${fmtTs(r.ts_ms || r.when || r.ts || r.created_at)}</span>` },
              ]} .rows=${logs} .loading=${!this.data.logs} empty="No log lines."></data-table>
            </div>
          </div>`;
      }
      _lvl(l) {
        const s = String(l || 'info').toLowerCase();
        const k = s.includes('err') || s.includes('crit') ? 'err' : s.includes('warn') ? 'warn' : '';
        return html`<span class="pill ${k}">${s}</span>`;
      }
      _notifications() {
        const list = this.data.notifications?.notifications || [];
        return html`<div class="card">
          <div class="card-h"><h3>Notifications (${list.length})</h3>${this._rawBtn('Notifications — raw', this.data.notifications)}</div>
          <data-table .cols=${[
            { key: 'severity', label: 'Severity', render: r => html`<span class="pill ${r.severity === 'warning' ? 'warn' : r.severity === 'error' ? 'err' : 'ha'}">${r.severity || 'info'}</span>` },
            { key: 'title', label: 'Title', render: r => html`<b>${r.title}</b>` },
            { key: 'message', label: 'Message' },
            { key: 'created_at', label: 'Created', render: r => html`<span class="muted">${fmtTs(r.created_at)}</span>` },
          ]} .rows=${list} .loading=${!this.data.notifications}
            .onrow=${r => (this._drawer = { title: r.title, data: r })} empty="No notifications."></data-table>
        </div>`;
      }
      _services() {
        const d = this.data.services || {};
        const integrations = d.integrations || [], addons = d.addons || [];
        return html`
          <div class="card">
            <div class="card-h"><h3>Integrations (${integrations.length})</h3>${this._rawBtn('Services — raw', d)}</div>
            <data-table .cols=${[
              { key: 'name', label: 'Name', render: r => html`<b>${r.name}</b>` },
              { key: 'domain', label: 'Domain', mono: true },
              { key: 'state', label: 'State', render: r => html`<span class="pill ${/load|run|start|ok/i.test(r.state) ? 'ok' : ''}">${r.state}</span>` },
            ]} .rows=${integrations} .loading=${!this.data.services} empty="No integrations."></data-table>
          </div>
          <div class="card">
            <div class="card-h"><h3>Supervisor add-ons (${addons.length})</h3></div>
            <data-table .cols=${[
              { key: 'name', label: 'Name', render: r => html`<b>${r.name}</b>` },
              { key: 'slug', label: 'Slug', mono: true },
              { key: 'version', label: 'Version', render: r => html`<span class="mono">v${r.version}</span>` },
              { key: 'state', label: 'State', render: r => html`<span class="pill ${r.state === 'started' ? 'ok' : ''}">${r.state}</span>` },
            ]} .rows=${addons} .loading=${!this.data.services} empty="None — this is not a supervised install."></data-table>
          </div>`;
      }
      _devices() {
        const list = this.data.devices?.devices || [];
        return html`<div class="card">
          <div class="card-h"><h3>Device registry (${list.length})</h3>${this._rawBtn('Devices — raw', this.data.devices)}</div>
          <data-table .cols=${[
            { key: 'name', label: 'Name', render: r => html`<b>${r.name}</b>` },
            { key: 'manufacturer', label: 'Manufacturer' },
            { key: 'model', label: 'Model', mono: true },
            { key: 'area', label: 'Area', render: r => r.area ? html`<span class="pill">${r.area}</span>` : html`<span class="muted">—</span>` },
            { key: 'entities', label: 'Entities', align: 'right', render: r => html`<span class="num">${r.entities ?? 0}</span>` },
          ]} .rows=${list} .loading=${!this.data.devices}
            .onrow=${r => (this._drawer = { title: r.name, data: r })} empty="No devices."></data-table>
        </div>`;
      }
      _updates() {
        const list = this.data.updates?.updates || [];
        return html`<div class="card">
          <div class="card-h"><h3>Pending updates (${list.length})</h3>${this._rawBtn('Updates — raw', this.data.updates)}</div>
          <data-table .cols=${[
            { key: 'title', label: 'Component', render: r => html`<b>${r.title}</b>` },
            { key: 'installed_version', label: 'Installed', render: r => html`<span class="mono">${r.installed_version}</span>` },
            { key: 'latest_version', label: 'Latest', render: r => html`<span class="verlead mono">→ <b>${r.latest_version}</b></span>` },
            { key: 'in_progress', label: 'Status', render: r => r.in_progress ? html`<span class="pill ha">installing</span>` : html`<span class="pill warn">available</span>` },
          ]} .rows=${list} .loading=${!this.data.updates} empty="Everything is up to date."></data-table>
        </div>`;
      }
      _audit() {
        const list = this.data.audit?.audit || this.data.audit?.entries || (Array.isArray(this.data.audit) ? this.data.audit : []);
        const txt = (v) => (v == null ? '' : typeof v === 'object' ? (Object.keys(v).length ? JSON.stringify(v) : '') : String(v));
        return html`<div class="card">
          <div class="card-h"><h3>Audit log (last ${list.length})</h3>${this._rawBtn('Audit — raw', this.data.audit)}</div>
          <data-table .cols=${[
            { key: 'ts_ms', label: 'Time', render: r => html`<span class="muted">${fmtTs(r.ts_ms || r.ts || r.when)}</span>` },
            { key: 'actor', label: 'Actor', mono: true, render: r => html`<span class="mono">${r.actor || r.principal || '—'}</span>` },
            { key: 'action', label: 'Action', render: r => html`<span class="pill">${r.action || r.op || '—'}</span>` },
            { key: 'result', label: 'Result', render: r => html`<span class="pill ${r.result === 'ok' ? 'ok' : r.result ? 'warn' : ''}">${r.result || '—'}</span>` },
            { key: 'detail', label: 'Detail', render: r => html`<span class="muted mono">${txt(r.detail) || txt(r.target)}</span>` },
          ]} .rows=${list} .loading=${!this.data.audit}
            .onrow=${r => (this._drawer = { title: `Audit #${r.audit_id ?? ''}`, data: r })} empty="No audit entries."></data-table>
        </div>`;
      }

      /* ---- action views --------------------------------------------------- */
      _manage() {
        const id = this.id();
        return html`
          ${this._gate('operator')}
          <div class="card">
            <div class="card-h"><h3>Lifecycle</h3></div>
            <div class="row">
              <button class="danger" ?disabled=${this.busy || !this.can('admin')}
                @click=${() => confirm('Restart HA Core on this instance?') && this._run('Restart HA Core', `/instances/${id}/restart`, { method: 'POST' })}>
                ${icon.restart} Restart HA Core <span class="pill role">admin</span></button>
              <button ?disabled=${this.busy} @click=${() => this._run('Health', `/instances/${id}/health`, {})}>Health check</button>
              <button ?disabled=${this.busy} @click=${() => this._run('Config check', `/instances/${id}/config/check`, {})}>Validate config</button>
            </div>
          </div>
          <div class="card">
            <div class="card-h"><h3>Dashboard</h3></div>
            <button class="primary" ?disabled=${this.busy || !this.can('operator')}
              @click=${() => this._run('Save dashboard', `/instances/${id}/dashboards/lovelace/save`, { method: 'POST', body: { title: 'Pushed from UI', ts: Date.now() } })}>
              Save demo dashboard <span class="pill role">operator</span></button>
          </div>`;
      }
      _backups() {
        const id = this.id();
        return html`
          ${this._gate('operator')}
          <div class="card">
            <div class="card-h"><h3>Backups</h3></div>
            <div class="row">
              <button ?disabled=${this.busy} @click=${() => this._run('List backups', `/instances/${id}/backups`, {})}>List backups</button>
              <button class="primary" ?disabled=${this.busy || !this.can('operator')}
                @click=${() => this._run('Create backup', `/instances/${id}/backups`, { method: 'POST', body: { name: `ui-${Date.now()}` } })}>
                Create backup <span class="pill role">operator</span></button>
            </div>
            <label>Restore from slug <span class="pill role">admin</span></label>
            <div class="row">
              <input id="slug" placeholder="backup slug" style="min-width:220px" />
              <button class="danger" ?disabled=${this.busy || !this.can('admin')}
                @click=${() => { const s = this.q('#slug').value.trim();
                  if (s && confirm(`Restore ${s}? This overwrites the instance.`)) this._run('Restore backup', `/instances/${id}/backups/${encodeURIComponent(s)}/restore`, { method: 'POST' }); }}>
                Restore</button>
            </div>
          </div>`;
      }
      _users() {
        const id = this.id();
        return html`
          ${this._gate('operator')}
          <div class="card">
            <div class="card-h"><h3>Users</h3>
              <button ?disabled=${this.busy} @click=${() => this._run('List users', `/instances/${id}/users`, {})}>List users</button></div>
            <label>Create user <span class="pill role">operator</span></label>
            <div class="row">
              <input id="uname" placeholder="username" />
              <select id="urole"><option value="user">user</option><option value="admin">admin</option></select>
              <button class="primary" ?disabled=${this.busy || !this.can('operator')}
                @click=${() => { const n = this.q('#uname').value.trim();
                  if (n) this._run('Create user', `/instances/${id}/users`, { method: 'POST', body: { username: n, role: this.q('#urole').value } }); }}>Create</button>
            </div>
            <label>Delete user by id <span class="pill role">admin</span></label>
            <div class="row">
              <input id="uid" placeholder="user id" />
              <button class="danger" ?disabled=${this.busy || !this.can('admin')}
                @click=${() => { const u = this.q('#uid').value.trim();
                  if (u && confirm(`Delete user ${u}?`)) this._run('Delete user', `/instances/${id}/users/${encodeURIComponent(u)}`, { method: 'DELETE' }); }}>Delete</button>
            </div>
          </div>`;
      }
      _proxy() {
        const id = this.id();
        return html`
          <div class="card">
            <div class="card-h"><h3>Identity-aware proxy</h3></div>
            <p class="muted" style="margin-top:0">Default-deny. You need a grant for this instance; the principal is your verified session.</p>
            <label>Grant yourself <span class="pill role">admin</span></label>
            <button ?disabled=${this.busy || !this.can('admin')}
              @click=${() => this._run('Grant proxy', `/grants`, { method: 'POST', body: { principal: this.me.sub, instance_id: id, scope: { proxy: true } } })}>
              Grant proxy to ${this.me?.sub ?? '—'}</button>
            <label>Open proxy stream</label>
            <div class="row">
              <input id="ppath" value="/" style="min-width:220px" />
              <button class="primary" ?disabled=${this.busy || !this.me?.authenticated}
                @click=${() => this._run('Open proxy', `/instances/${id}/proxy/open`, { method: 'POST', body: { path: this.q('#ppath').value } })}>Open</button>
            </div>
          </div>`;
      }
      _selfupdate() {
        const id = this.id();
        return html`
          ${this._gate('operator')}
          <div class="card">
            <div class="card-h"><h3>Agent self-update</h3></div>
            <p class="muted" style="margin-top:0">A/B slot flip with a health gate — uncheck "health passes" to force a rollback.</p>
            <label>Push version <span class="pill role">operator</span></label>
            <div class="row">
              <input id="ver" placeholder="9.9.10" />
              <label style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg2)">
                <input type="checkbox" id="hok" checked style="height:auto;vertical-align:-1px" /> health passes</label>
              <button class="primary" ?disabled=${this.busy || !this.can('operator')}
                @click=${() => this._run('Push update', `/instances/${id}/agent/update`, { method: 'POST', body: { version: this.q('#ver').value.trim() || '9.9.10', health_ok: this.q('#hok').checked } })}>Push update</button>
            </div>
          </div>
          <div class="card">
            <div class="card-h"><h3>Certificate &amp; revocation <span class="pill role">admin</span></h3></div>
            <div class="row">
              <button ?disabled=${this.busy || !this.can('admin')} @click=${() => this._run('Rotate cert', `/instances/${id}/rotate/cert`, { method: 'POST', body: {} })}>Rotate certificate</button>
              <button class="danger" ?disabled=${this.busy || !this.can('admin')}
                @click=${() => confirm('Revoke this instance? It must re-enroll to reconnect.') && this._run('Revoke', `/instances/${id}/revoke`, { method: 'POST' })}>Revoke instance</button>
            </div>
          </div>`;
      }
      _gate(role) {
        if (this.can(role)) return nothing;
        return html`<div class="gate">${icon.warn}
          ${this.me?.authenticated
            ? html`Your role (<b>${this.me.role}</b>) can't perform every action here — ${role}+ controls are disabled.`
            : html`Sign in to perform ${role}+ actions.`}</div>`;
      }
    }
    customElements.define('instance-pane', InstancePane);

    /* ======================================================================
       <templates-panel>
       ====================================================================== */
    class TemplatesPanel extends LitElement {
      static properties = { me: { attribute: false }, templates: { state: true }, result: { state: true }, busy: { state: true } };
      static styles = [ui, css`
        :host { display: block; max-width: 820px; }
      `];
      constructor() { super(); this.templates = []; this.result = null; this.busy = false; }
      connectedCallback() { super.connectedCallback(); this._load(); }
      can(min) { const o = { viewer: 0, operator: 1, admin: 2 }; return this.me?.authenticated && o[this.me.role] >= o[min]; }
      async _load() { const { json } = await api('/templates'); this.templates = json.templates || []; }
      async _run(label, path, opts) { this.busy = true; this.result = { ...(await api(path, opts)), label }; this.busy = false; await this._load(); }
      render() {
        return html`<div class="card">
          <div class="card-h"><h3>Templates &amp; bulk push <span class="pill role">operator</span></h3></div>
          <data-table .cols=${[
            { key: 'name', label: 'Name', render: t => html`<b>${t.name}</b>` },
            { key: 'kind', label: 'Kind', render: t => html`<span class="pill">${t.kind}</span>` },
            { key: '_', label: '', align: 'right', render: t => html`<button class="primary" ?disabled=${this.busy || !this.can('operator')}
                @click=${() => this._run('Push to all', `/templates/${t.template_id || t.id}/push`, { method: 'POST', body: { all: true } })}>Push to all</button>` },
          ]} .rows=${this.templates} empty="No templates yet."></data-table>
          <label>New template</label>
          <div class="row">
            <input id="tname" placeholder="name" />
            <select id="tkind"><option value="dashboard">dashboard</option><option value="automation">automation</option></select>
            <button class="primary" ?disabled=${this.busy || !this.can('operator')}
              @click=${() => { const n = this.renderRoot.querySelector('#tname').value.trim();
                if (n) this._run('Create template', '/templates', { method: 'POST', body: { kind: this.renderRoot.querySelector('#tkind').value, name: n, body: { title: n } } }); }}>Create</button>
          </div>
          <result-box .result=${this.result}></result-box>
        </div>`;
      }
    }
    customElements.define('templates-panel', TemplatesPanel);
  </script>
</body>
</html>
